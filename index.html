<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081011"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>IRONFORM</title>
<style>
:root{--bg:#081011;--panel:#11191d;--panel2:#0d171a;--line:#26343a;--text:#f4f4ef;--muted:#98a5aa;--accent:#63e6d1;--warn:#ffb56b}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.35}.shell{max-width:620px;margin:auto;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;background:rgba(8,16,17,.96);backdrop-filter:blur(12px);padding:11px 0 10px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;margin-bottom:9px}.brand strong{font-size:13px;letter-spacing:.13em;color:var(--accent);white-space:nowrap}.spacer{flex:1}.btn{border:1px solid #35505a;background:#152126;color:var(--text);border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer}.btn.primary{background:#17433d;border-color:#2d796d;color:#d8fff8}select{width:100%;font-size:16px;color:var(--text);background:#121d21;border:1px solid #33464d;border-radius:12px;padding:12px}.hero{padding:20px 0 6px}.eyebrow,.label{color:var(--accent);font-weight:850;letter-spacing:.09em;font-size:11px;text-transform:uppercase}h1{font-size:32px;line-height:1.04;margin:6px 0 7px;letter-spacing:-.025em}.status{display:inline-block;font-size:11px;font-weight:850;letter-spacing:.08em;background:#19302f;color:#8ff3df;padding:5px 8px;border-radius:8px}.status.arm{background:#33200f;color:#ffb56b}.status.prime{background:#2a1835;color:#dcb0ff}.dateLine{color:var(--muted);font-size:13px;margin-top:9px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.verse-ref{font-size:17px;font-weight:850;margin-top:5px}.verse-text{font-size:19px;line-height:1.5;margin-top:9px}.verse-placeholder{font-size:13px;color:var(--muted);margin-top:9px;padding:10px 12px;border:1px dashed #3a5057;border-radius:10px}.scripture-source{font-size:10px;line-height:1.35;color:#738086;margin-top:10px}.walk{display:flex;align-items:center;justify-content:space-between;gap:12px}.walkname{font-weight:800;font-size:18px;margin-top:3px}.walkrx{font-size:19px;font-weight:900;white-space:nowrap}.exercises{padding:0 16px}.exercise{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:15px 0;border-top:1px solid var(--line);align-items:center}.exercise:first-child{border-top:0}.exname{font-weight:800;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.rx{text-align:right;min-width:82px}.rx strong,.rx span{display:block}.rx strong{font-size:18px}.rx span{font-size:14px;color:var(--muted);margin-top:2px}.note{font-size:13px;color:var(--muted);padding:4px 4px 10px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.nav button{padding:13px;border-radius:12px;border:1px solid #33464d;background:#121d21;color:var(--text);font-weight:800}.footer{color:#738086;font-size:11px;text-align:center;margin:22px 0 10px}.overlay{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:12px;background:rgba(0,0,0,.72);z-index:60}.overlay.open{display:flex}.panel{width:min(600px,100%);max-height:90vh;overflow:auto;background:#11191d;border:1px solid #33464d;border-radius:20px 20px 14px 14px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}.panel h2{margin:0 0 6px}.panel p{color:var(--muted);font-size:13px}.panel input{width:100%;font-size:16px;color:var(--text);background:#0b1417;border:1px solid #33464d;border-radius:12px;padding:12px;margin:8px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{padding:12px;border-radius:12px;border:1px solid #33464d;background:#172227;color:var(--text);font-weight:800}.setupStatus{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}.close{float:right;border:0;background:transparent;color:var(--muted);font-size:24px}.syncdot{width:8px;height:8px;border-radius:50%;background:#68757a;display:inline-block;margin-right:6px}.syncdot.ok{background:#63e6d1}@media(max-width:380px){h1{font-size:29px}.verse-text{font-size:18px}.brand strong{font-size:12px}.btn{padding:8px 10px}}
</style></head><body>
<div class="shell">
  <div class="top">
    <div class="brand"><strong>IRONFORM</strong><span class="spacer"></span><button id="scriptureBtn" class="btn">SCRIPTURE</button><button id="todayBtn" class="btn primary">TODAY</button></div>
    <select id="picker" aria-label="Choose workout day"></select>
  </div>
  <main id="app"></main>
  <div class="nav"><button id="prevBtn">← Previous</button><button id="nextBtn">Next →</button></div>
  <div class="footer"><span id="syncState"><span class="syncdot"></span>IRONFORM hosted edition</span><br>Workout date follows this device's local calendar.</div>
</div>
<div id="overlay" class="overlay"><div class="panel"><button id="closeBtn" class="close">×</button><h2>NKJV Scripture</h2><p>API.Bible key is stored only in this browser on this device. It is never saved to GitHub.</p><input id="apiKey" type="password" autocomplete="off" placeholder="Paste API.Bible key"><div class="actions"><button id="clearBtn">CLEAR</button><button id="syncBtn" class="primary">CONNECT + SYNC</button></div><div id="setupStatus" class="setupStatus"></div></div></div>
<script src="./data.js"></script>
<script>
(()=>{
const D=window.IRONFORM_DATA||[], app=document.getElementById('app'), picker=document.getElementById('picker');
const API_BASE='https://rest.api.bible/v1', KEY='ironform:bibleKey', BIBLE='ironform:bible', CACHE='ironform:nkjvCache', MAXAGE=30*24*60*60*1000;
let idx=0;
const pad=n=>String(n).padStart(2,'0');
const localISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const findToday=()=>{const t=localISO();let i=D.findIndex(x=>x.date===t);if(i>=0)return i;const now=new Date(t+'T12:00:00');let best=0,bestDiff=Infinity;D.forEach((x,j)=>{const diff=Math.abs(new Date(x.date+'T12:00:00')-now);if(diff<bestDiff){bestDiff=diff;best=j}});return best};
function escapeHTML(s=''){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function statusClass(s){s=(s||'').toLowerCase();return s.includes('arm')?'arm':s.includes('cruise')?'prime':''}
function labelFor(d){return d.w?`W${d.w} D${d.d} · ${new Date(d.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${d.title}`:`${new Date(d.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${d.title}`}
D.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=labelFor(d);picker.appendChild(o)});
function getCache(){try{return JSON.parse(localStorage.getItem(CACHE)||'{}')}catch{return {}}}
function saveCache(c){try{localStorage.setItem(CACHE,JSON.stringify(c))}catch{}}
function getKey(){try{return localStorage.getItem(KEY)||''}catch{return ''}}
function getBible(){try{return JSON.parse(localStorage.getItem(BIBLE)||'null')}catch{return null}}
function setBible(x){try{localStorage.setItem(BIBLE,JSON.stringify(x))}catch{}}
const bookCodes={'Genesis':'GEN','Exodus':'EXO','Leviticus':'LEV','Numbers':'NUM','Deuteronomy':'DEU','Joshua':'JOS','Judges':'JDG','Ruth':'RUT','1 Samuel':'1SA','2 Samuel':'2SA','1 Kings':'1KI','2 Kings':'2KI','1 Chronicles':'1CH','2 Chronicles':'2CH','Ezra':'EZR','Nehemiah':'NEH','Esther':'EST','Job':'JOB','Psalm':'PSA','Psalms':'PSA','Proverbs':'PRO','Ecclesiastes':'ECC','Song of Solomon':'SNG','Isaiah':'ISA','Jeremiah':'JER','Lamentations':'LAM','Ezekiel':'EZK','Daniel':'DAN','Hosea':'HOS','Joel':'JOL','Amos':'AMO','Obadiah':'OBA','Jonah':'JON','Micah':'MIC','Nahum':'NAM','Habakkuk':'HAB','Zephaniah':'ZEP','Haggai':'HAG','Zechariah':'ZEC','Malachi':'MAL','Matthew':'MAT','Mark':'MRK','Luke':'LUK','John':'JHN','Acts':'ACT','Romans':'ROM','1 Corinthians':'1CO','2 Corinthians':'2CO','Galatians':'GAL','Ephesians':'EPH','Philippians':'PHP','Colossians':'COL','1 Thessalonians':'1TH','2 Thessalonians':'2TH','1 Timothy':'1TI','2 Timothy':'2TI','Titus':'TIT','Philemon':'PHM','Hebrews':'HEB','James':'JAS','1 Peter':'1PE','2 Peter':'2PE','1 John':'1JN','2 John':'2JN','3 John':'3JN','Jude':'JUD','Revelation':'REV'};
function verseId(ref){const m=ref.match(/^(.+?)\s+(\d+):(\d+)$/);if(!m||!bookCodes[m[1]])throw Error('Unsupported verse: '+ref);return `${bookCodes[m[1]]}.${m[2]}.${m[3]}`}
async function api(path,key){const r=await fetch(API_BASE+path,{headers:{'api-key':key}});if(!r.ok)throw Error(`API.Bible ${r.status}`);return r.json()}
async function nkjv(key){const saved=getBible();if(saved?.id)return saved;const j=await api('/bibles?language=eng&include-full-details=true',key), hit=(j.data||[]).find(b=>(b.name||'').toLowerCase().includes('new king james')||((b.abbreviation||'')+' '+(b.abbreviationLocal||'')).toLowerCase().includes('nkjv'));if(!hit)throw Error('NKJV is not enabled for this API.Bible key.');const b={id:hit.id,name:hit.name||'New King James Version'};setBible(b);return b}
async function getVerse(ref,force=false){const c=getCache(), old=c[ref];if(!force&&old&&Date.now()-old.at<MAXAGE)return old;const key=getKey();if(!key)return old||null;const b=await nkjv(key), q='?content-type=text&include-notes=false&include-titles=false&include-chapter-numbers=false&include-verse-numbers=false', j=await api(`/bibles/${encodeURIComponent(b.id)}/verses/${encodeURIComponent(verseId(ref))}${q}`,key);const item={text:String(j.data?.content||'').trim(),at:Date.now()};if(!item.text)throw Error('No Scripture text returned.');c[ref]=item;saveCache(c);return item}
function render(d){document.title=`IRONFORM · ${d.title}`;picker.value=idx;const ex=d.ex.map(x=>`<div class="exercise"><div><div class="exname">${escapeHTML(x[0])}</div><div class="meta">${escapeHTML(x[1])}</div></div><div class="rx"><strong>${escapeHTML(x[2])}</strong><span>${escapeHTML(x[3])}</span></div></div>`).join('');app.innerHTML=`<div class="hero"><div class="eyebrow">${d.w?`IRONFORM · WEEK ${d.w} · DAY ${d.d}`:'IRONFORM · CRUISE PRIME'}</div><h1>${escapeHTML(d.title)}</h1><span class="status ${statusClass(d.status)}">${escapeHTML(d.status)}</span><div class="dateLine">${escapeHTML(d.dateLine)}</div></div><div class="card devotion"><div class="label">DAILY DEVOTION · NKJV</div><div class="verse-ref">${escapeHTML(d.verse)}</div><div id="verseText" class="verse-text"></div><div id="versePlaceholder" class="verse-placeholder">${getKey()?'Loading NKJV…':'Tap SCRIPTURE once on this device to connect NKJV.'}</div><div class="scripture-source">Scripture taken from the New King James Version®. Copyright © 1982 by Thomas Nelson. Used by permission. All rights reserved.</div></div><div class="card walk"><div><div class="label">PRE-SESSION</div><div class="walkname">Weighted-vest walk</div></div><div class="walkrx">${escapeHTML(d.walk)}</div></div><div class="card exercises">${ex}</div><div class="note">${escapeHTML(d.note)}</div>`;renderVerse(d.verse)}
async function renderVerse(ref){const text=document.getElementById('verseText'), ph=document.getElementById('versePlaceholder');const cached=getCache()[ref];if(cached?.text){text.textContent=cached.text;ph.style.display='none'}try{const v=await getVerse(ref,false);if(v?.text&&document.getElementById('verseText')===text){text.textContent=v.text;ph.style.display='none';document.querySelector('#syncState .syncdot')?.classList.add('ok')}}catch(e){if(!cached){ph.textContent='NKJV could not sync. Tap SCRIPTURE to reconnect.'}}}
function show(i){idx=Math.max(0,Math.min(D.length-1,i));render(D[idx]);history.replaceState(null,'',`#${D[idx].date}`)}
function goToday(){show(findToday())}
picker.addEventListener('change',()=>show(+picker.value));document.getElementById('todayBtn').onclick=goToday;document.getElementById('prevBtn').onclick=()=>show(idx-1);document.getElementById('nextBtn').onclick=()=>show(idx+1);
window.addEventListener('focus',()=>{if(document.visibilityState==='visible')goToday()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')goToday()});setInterval(()=>{if(D[idx]?.date!==localISO())goToday()},60000);
const overlay=document.getElementById('overlay'), input=document.getElementById('apiKey'), stat=document.getElementById('setupStatus');document.getElementById('scriptureBtn').onclick=()=>{input.value=getKey();stat.textContent=getKey()?'Key saved on this device. Sync again any time.':'Paste your API.Bible key once on this device.';overlay.classList.add('open')};document.getElementById('closeBtn').onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};document.getElementById('clearBtn').onclick=()=>{localStorage.removeItem(KEY);localStorage.removeItem(BIBLE);localStorage.removeItem(CACHE);input.value='';stat.textContent='Scripture connection cleared from this device.';render(D[idx])};document.getElementById('syncBtn').onclick=async()=>{const key=input.value.trim();if(!key){stat.textContent='Paste your API.Bible key first.';return}localStorage.setItem(KEY,key);localStorage.removeItem(BIBLE);try{stat.textContent='Connecting to NKJV…';await nkjv(key);const refs=[...new Set(D.map(x=>x.verse))];let done=0;for(const ref of refs){await getVerse(ref,true);done++;stat.textContent=`Syncing NKJV ${done}/${refs.length} · ${ref}`}stat.textContent='NKJV synced on this device.';render(D[idx])}catch(e){stat.textContent=e.message||String(e)}};
const hash=location.hash.slice(1);const h=hash&&D.findIndex(x=>x.date===hash);show(h>=0?h:findToday());
})();
</script>
<script>if('serviceWorker'in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body></html>
